name: gitleaks-scan

on:
    push:
        branches: [ devsecops ]
    workflow_dispatch:
jobs:
    gitleaks-scan:
      runs-on: ubuntu-latest
      steps: 
        - name: Checkout code 
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Run gitleaks scan
          uses: gitleaks/gitleaks-action@v3
          with:
            gitleaks-version: v8.0.0
          env:
            GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}