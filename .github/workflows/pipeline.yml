
name: devsecops-pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - devsecops

jobs:
  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
    secrets: inherit

  build:
    needs: secrets-scan
    uses: ./.github/workflows/build.yml
    secrets: inherit

  ci:
    needs: build
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit
