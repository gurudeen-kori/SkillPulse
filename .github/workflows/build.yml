name: docker build & push

on:
  push:
    branches: [ devsecops ]
  pull_request:
    branches: [ devsecops ]
  workflow_dispatch:
jobs:
    frontend-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: Set up QEMU
            uses: docker/setup-qemu-action@v2
          - name: login to docker hub
            uses: docker/login-action@v4
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}


          - name: build fronend docker image
            uses: docker/build-push-action@v5
            with:
             context: .
             file: ./frontend/Dockerfile
             push: true
             tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.sha }}

    backend-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: login to docker hub
            uses: docker/login-action@v4
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: build backend docker image
            uses: docker/build-push-action@v5
            with:
             context: .
             file: ./backend/Dockerfile
             push: true
             tags: |
               ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
               ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }}